[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-ops-mcp"
version = "0.60.2"
description = "MCP server for Home Assistant operations — database, config, dashboards, entities, and system health"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Maciej Rohleder", email = "dude84@users.noreply.github.com" },
]
keywords = ["home-assistant", "mcp", "model-context-protocol", "smart-home", "ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

# Upper bounds are NOT optional here. The HA addon image is built ON THE HA
# HOST at install/update time, resolving every dependency fresh — there is no
# lockfile and no pre-built wheel to fall back on. An unbounded `>=` means a
# dependency's next major release ships straight into a user's addon and can
# break startup with no code change on our side. That is exactly what happened
# in v0.55.1: `mcp` 2.0.0 removed `mcp.server.fastmcp` (renamed to
# `mcp.server.mcpserver`) and every rebuild died on ImportError.
#
# Rule: cap at the next major for 1.0+ packages; for 0.x, cap at the next
# minor, since that's where 0.x projects put their breaking changes.
# Raising a cap is a deliberate act — bump it, run the suite, ship a release.
dependencies = [
    "mcp>=1.0.0,<2",  # 2.x is a full API rename (FastMCP -> McpServer); not a drop-in
    "aiohttp>=3.9,<4",
    "websockets>=12.0,<17",
    "ruamel.yaml>=0.18,<0.19",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "aiomysql>=0.2,<1",
    "asyncpg>=0.29,<1",
    "deepdiff>=7.0,<10",
    "rapidfuzz>=3.6,<4",
    "jsonpatch>=1.33,<2",
    "pillow>=10.0,<13",  # downscale stored captures for haops_capture_show
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ha-ops-mcp = "ha_ops_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/dude84/ha-ops-mcp"
Repository = "https://github.com/dude84/ha-ops-mcp"
Issues = "https://github.com/dude84/ha-ops-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_ops_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["TC003"]  # Path is used at runtime with from __future__ import annotations

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# jsonpatch and its jsonpointer dependency have no bundled type stubs.
# The surface we use is small and well-documented (JsonPatch, apply,
# the exception hierarchy), so treating them as Any here is safer than
# wedging PEP 561 compliance onto a third-party dep.
[[tool.mypy.overrides]]
module = ["jsonpatch"]
ignore_missing_imports = true

# Playwright is NOT a pip dependency — it's installed into the image separately
# (Debian build only) and imported lazily, guarded by browser_available(). It
# won't be present in CI/dev, so treat it as Any rather than failing --strict.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
